name: One-time users edit result fix

on:
  push:
    branches: [desktop-v1]
    paths:
      - 'scripts/patch-users-edit-result.mjs'
      - '.github/workflows/one-time-users-edit-result.yml'

permissions:
  contents: write

jobs:
  patch-users-view:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4
        with:
          ref: desktop-v1
          fetch-depth: 0

      - name: Apply guarded users edit patch
        run: node scripts/patch-users-edit-result.mjs

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No users edit changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/users/UsersManagementView.tsx
          git commit -m "Keep user edit validation errors in modal"
          git push origin HEAD:desktop-v1
