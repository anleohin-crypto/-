name: One-time absence workday fix

on:
  push:
    branches: [desktop-v1]
    paths:
      - 'scripts/patch-absence-workdays.mjs'
      - '.github/workflows/one-time-absence-workdays.yml'

permissions:
  contents: write

jobs:
  patch-absence-workdays:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4
        with:
          ref: desktop-v1
          fetch-depth: 0

      - name: Apply guarded absence workday patch
        run: node scripts/patch-absence-workdays.mjs

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No absence workday changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/absences/AbsencesView.tsx
          git commit -m "Fix absence workday calculation to use settings"
          git push origin HEAD:desktop-v1
